<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Giacomo 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="mechanic_data.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: 'Inter', sans-serif;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }
    </style>
</head>

<body class="p-8 min-h-screen">
    <header class="mb-8 flex justify-between items-center bg-slate-800 p-6 rounded-2xl border border-cyan-500/30">
        <div>
            <h1 class="text-3xl font-bold text-cyan-400">GIACOMO</h1>
            <p class="text-slate-400">Dashboard Personale</p>
        </div>
        <div class="text-right">
            <p class="text-sm text-slate-500">Mese Attuale</p>
            <p class="text-2xl font-bold text-white" id="month-label">--</p>
        </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <!-- REMOVED: Ore Commessa as requested -->
        <div class="card p-6 border-cyan-500/20 hidden"> <!-- Hidden via Tailwind or CSS -->
            <h3 class="text-slate-400 text-sm">Ore Commessa</h3>
            <p class="text-4xl font-bold text-white mt-2" id="val-comm">0</p>
        </div>
        <div class="card p-6 border-cyan-500/20">
            <h3 class="text-slate-400 text-sm">Ore Vendute Reali</h3>
            <p class="text-4xl font-bold text-blue-400 mt-2" id="val-vend">0</p>
        </div>
        <div class="card p-6 border-cyan-500/20">
            <h3 class="text-slate-400 text-sm">Premio Maturato</h3>
            <p class="text-4xl font-bold text-emerald-400 mt-2" id="val-premio">€ 0</p>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="card p-6">
            <h3 class="text-lg font-semibold mb-4 text-slate-300">Performance Corrente</h3>
            <div id="gauge-eff" style="height: 300px;"></div>
        </div>
        <div class="card p-6">
            <h3 class="text-lg font-semibold mb-4 text-slate-300">Andamento Premio (Annuale)</h3>
            <div id="chart-trend" style="height: 300px;"></div>
        </div>
    </div>

    <!-- History Table -->
    <div class="card p-6 mt-6 col-span-1 md:col-span-3 lg:col-span-2">
        <h3 class="text-xl font-bold text-slate-300 mb-4">Storico Mensile</h3>
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="text-slate-400 border-b border-slate-700">
                        <th class="p-3">Mese</th>
                        <th class="p-3">Ore Vendute</th>
                        <th class="p-3">Premio</th>
                    </tr>
                </thead>
                <tbody id="history-table-body" class="text-slate-200">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!window.mechanicData) return;
            const data = window.mechanicData;
            const latest = data.latest;
            const P = latest.giacomo;

            document.getElementById('month-label').textContent = latest.month;
            document.getElementById('val-vend').textContent = P.vendute.toFixed(1);
            document.getElementById('val-premio').textContent = '€ ' + P.premio.toLocaleString('it-IT');

            // Gauge
            const chartGauge = echarts.init(document.getElementById('gauge-eff'));
            const hoursVal = P.vendute;
            const target = 120;
            const gaugeColor = hoursVal >= target ? '#10B981' : '#22D3EE';

            chartGauge.setOption({
                series: [{
                    type: 'gauge',
                    min: 0, max: 160,
                    axisLine: { lineStyle: { width: 20, color: [[0.75, '#334155'], [1, '#10B981']] } },
                    progress: { show: true, width: 20, itemStyle: { color: gaugeColor } },
                    pointer: { show: false },
                    axisTick: { show: false }, splitLine: { show: false },
                    axisLabel: { formatter: (v) => v === 120 ? 'TARGET' : '', distance: -50, color: '#fff', fontSize: 14 },
                    detail: { valueAnimation: true, formatter: '{value} h', fontSize: 40, color: '#fff', offsetCenter: [0, '0%'] },
                    data: [{ value: hoursVal.toFixed(1) }]
                }]
            });

            // Trend Chart
            const chartTrend = echarts.init(document.getElementById('chart-trend'));
            if (data.months && data.giacomo.premio) {
                chartTrend.setOption({
                    tooltip: { trigger: 'axis' },
                    xAxis: { type: 'category', data: data.months, axisLabel: { color: '#ccc' } },
                    yAxis: { type: 'value', axisLabel: { color: '#ccc' } },
                    series: [{
                        data: data.giacomo.premio,
                        type: 'line',
                        smooth: true,
                        itemStyle: { color: '#22D3EE' },
                        areaStyle: { opacity: 0.2, color: '#22D3EE' }
                    }]
                });
            } else {
                chartTrend.setOption({ title: { text: 'Dati storici non ancora disponibili', textStyle: { color: '#666', fontSize: 14 }, left: 'center', top: 'center' } });
            }

            // Special Prize Logic UI
            const prizeEl = document.getElementById('val-premio');
            if (hoursVal >= 120) {
                prizeEl.style.color = '#10B981';
                prizeEl.textContent = '€ ' + P.premio.toLocaleString('it-IT') + ' (Raggiunto!)';
            } else {
                prizeEl.style.color = '#64748b';
                prizeEl.textContent = '€ 0 (Target 120h)';
            }

            // History Table
            const tableBody = document.getElementById('history-table-body');
            if (tableBody && data.months) {
                tableBody.innerHTML = '';
                data.months.forEach((month, index) => {
                    const vend = data.giacomo.vendute[index];
                    const prem = data.giacomo.premio[index];

                    const tr = document.createElement('tr');
                    tr.className = 'border-b border-slate-800 hover:bg-slate-800/50';
                    tr.innerHTML = `
                        <td class="p-3 font-medium">${month}</td>
                        <td class="p-3 font-bold text-white">${vend > 0 ? vend.toFixed(1) : '-'}</td>
                        <td class="p-3 text-emerald-400 font-bold">${prem > 0 ? '€ ' + prem.toLocaleString('it-IT') : '-'}</td>
                    `;
                    tableBody.appendChild(tr);
                });
            }

            window.addEventListener('resize', () => { chartGauge.resize(); chartTrend.resize(); });
        });
    </script>
</body>

</html>
